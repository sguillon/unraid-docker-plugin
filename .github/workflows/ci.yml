name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'   # oldest PHP shipped by supported Unraid releases
      - run: for f in $(find src tests dev -name '*.php'); do php -l "$f"; done
      - run: php tests/TemplatesTest.php
      - run: node --check src/usr/local/emhttp/plugins/docker-template-editor/assets/editor.js
      - run: php -r 'libxml_use_internal_errors(false); exit(simplexml_load_file("docker-template-editor.plg") ? 0 : 1);'
      - name: Package builds
        run: build/build.sh "$(date +%Y.%m.%d)" && git checkout -- docker-template-editor.plg
